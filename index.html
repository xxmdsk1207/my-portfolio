<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ye Design</title>
<link rel="icon" type="image/png" sizes="32x32" href="images/favicon-32x32.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#fdfdfb;
    --panel:#f5f4f1;
    --ink:#3A3A3A;
    --ink-soft:#4a4a4b;
    --gray:#8c8b86;
    --gray-light:#b7b6b1;
    --line:#e4e3de;
    --line-strong:#1a1a1a;
    --serif: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
    --sans: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:var(--serif);
    -webkit-font-smoothing:antialiased;
    display:flex;flex-direction:column;min-height:100vh;
  }
  a{color:inherit;text-decoration:none;}
  #main-content img{max-width:100%;height:auto;object-fit:contain;}
  .eyebrow, .label, nav.top a, .sidebar-title, .sidebar-sub, .fig-cap, .footer, .nav-item .meta{
    font-family:var(--sans);
    letter-spacing:.06em;
  }

  /* ---------- Header ---------- */
  header.top{
    position:relative;
    z-index:1000;
    background:var(--bg);
    border-bottom:1px solid var(--line);
    flex-shrink:0;
  }
  .top-inner{
    display:flex;align-items:center;justify-content:space-between;
    max-width:1680px;margin:0 auto;
    padding:26px 40px 26px 48px;
  }
  header.top .brand{
    font-family:var(--sans);
    font-weight:700;
    font-size:13px;
    letter-spacing:.08em;
    text-transform:uppercase;
    cursor:pointer;
  }
  header.top .brand span{color:var(--gray);font-weight:600;}
  nav.top{display:flex;gap:32px;font-size:13px;text-transform:none;letter-spacing:.02em;}
  nav.top a{color:var(--gray-light);cursor:pointer;padding-bottom:4px;transition:color .15s;}
  nav.top a:hover{color:var(--ink);}
  nav.top a.active{color:var(--ink);font-weight:700;border-bottom:1px solid var(--ink);}

  /* Hamburger (mobile only — see responsive section). Lives inside the
     header, which sits above the overlay (z-index:1000 vs. 900), so the
     icon stays visible and clickable — including once it morphs to an
     X — the whole time the menu is open. */
  .hamburger-btn{
    display:none;
    flex-direction:column;justify-content:center;align-items:center;gap:5px;
    width:32px;height:32px;padding:0;background:none;border:none;cursor:pointer;
  }
  .hamburger-bar{
    display:block;width:20px;height:1.5px;background:var(--ink);
    transition:transform .25s ease, opacity .2s ease;
  }
  .hamburger-btn.open .hamburger-bar:nth-child(1){transform:translateY(6.5px) rotate(45deg);}
  .hamburger-btn.open .hamburger-bar:nth-child(2){opacity:0;}
  .hamburger-btn.open .hamburger-bar:nth-child(3){transform:translateY(-6.5px) rotate(-45deg);}

  /* Full-screen mobile nav overlay */
  .mobile-menu{
    position:fixed;inset:0;z-index:900;
    background:var(--bg);
    display:flex;align-items:flex-start;justify-content:flex-start;
    overflow-y:auto;
    opacity:0;visibility:hidden;
    transition:opacity .25s ease, visibility 0s linear .25s;
  }
  .mobile-menu.open{opacity:1;visibility:visible;transition:opacity .25s ease;}
  /* Dedicated close affordance inside the overlay itself, independent of
     the header's hamburger/X icon — always visible top-right whenever the
     menu is open. */
  .mobile-menu-close{
    position:fixed;top:20px;right:24px;z-index:1001;
    display:flex;align-items:center;justify-content:center;
    width:36px;height:36px;
    background:none;border:1px solid var(--line);border-radius:50%;
    font-family:var(--sans);font-size:16px;color:var(--ink);cursor:pointer;
    transition:border-color .15s ease, color .15s ease;
  }
  .mobile-menu-close:hover{border-color:var(--ink);}
  .mobile-menu-content{
    text-align:left;
    display:flex;flex-direction:column;align-items:flex-start;gap:32px;
    padding:100px 32px 60px;
    width:100%;
  }
  /* Same color logic as the desktop sidebar: the active view/category/item
     stays full-ink; everything else dims to gray (category-level) or
     gray-light (item-level) — same variables, same hierarchy. */
  .mobile-menu-top-link{
    display:block;
    font-family:var(--sans);
    font-size:19px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;
    color:var(--gray-light);cursor:pointer;
    padding:4px 0;
    transition:color .15s ease;
  }
  .mobile-menu-top-link.active{color:var(--ink);}
  .mobile-menu-category{display:flex;flex-direction:column;align-items:flex-start;gap:2px;width:100%;}
  .mobile-menu-cat-title{
    font-family:var(--sans);font-size:12px;font-weight:700;letter-spacing:.1em;
    text-transform:uppercase;color:var(--gray);
    margin-bottom:12px;
    transition:color .15s ease;
  }
  .mobile-menu-category.is-active-category .mobile-menu-cat-title{color:var(--ink);}
  .mobile-menu-links{display:flex;flex-direction:column;align-items:flex-start;width:100%;}
  .mobile-menu-link{
    display:block;
    font-family:var(--sans);font-size:17px;line-height:1.4;
    color:var(--gray-light);cursor:pointer;
    padding:9px 0;
    transition:color .15s ease;
  }
  .mobile-menu-link:hover{color:var(--ink-soft);}
  .mobile-menu-link.active{color:var(--ink);font-weight:600;}
  @media (min-width:841px){
    .mobile-menu{display:none !important;}
    .mobile-menu-close{display:none !important;}
  }

  /* ---------- Layout grid ---------- */
  .layout{
    display:grid;
    grid-template-columns:240px 1px minmax(0,1fr) 1px 440px;
    gap:0;
    max-width:1680px;
    margin:0 auto;
    flex:1 0 auto;
    width:100%;
  }
  .divider{background:var(--line);}
  .sidebar{
    --side-pad:48px;padding:44px 8px 44px var(--side-pad);
    position:relative;z-index:800;background:var(--bg);
  }
  .main{padding:44px 56px;min-width:0;position:relative;}
  .right{
    padding:44px 40px 44px 32px;
    position:sticky;
    top:44px;
    align-self:start;
  }
  /* Vertical mode lifts the sticky constraint off the whole column — each
     figure item becomes its own sticky element instead (see below). */
  .right.mode-vertical{position:static;align-self:auto;}

  /* ---------- Password-protected page lock ---------- */
  /* Applied to #main-content and #right-sidebar only — sidebar and header
     are never touched, so navigation always stays fully usable even while
     a page is locked. This never touches filter/position on .main/.right
     (that broke position:sticky figure positioning previously — `filter`
     makes an element a new containing block for its position:sticky/fixed
     descendants, which threw off every image's alignment). Interaction is
     still fully disabled here; the visual blur is a separate curtain child
     (see .blur-curtain below), regenerated as part of each render rather
     than living in a wrapper div — an earlier wrapper-based approach
     shrank .right's containing box down to match its own short sticky
     content, which silently broke the "tall track" sticky needs to travel
     within while scrolling (Stack/Horizontal view's whole point). Anchoring
     the curtain to .main/.right directly, as their own child, avoids that
     entirely since neither element's own box/positioning changes at all. */
  .main.is-locked, .right.is-locked{
    pointer-events:none;
    user-select:none;
  }
  /* Sits directly on top of .main / .right's own content (same box, exact
     match, no separate wrapper needed), blurring whatever renders
     underneath via backdrop-filter — a real visual blur with zero effect
     on the content's own layout/positioning. */
  .blur-curtain{
    display:none;
    position:absolute;inset:0;
    z-index:50;
    backdrop-filter:blur(12px);
    -webkit-backdrop-filter:blur(12px);
    pointer-events:none;
  }
  .blur-curtain.active{display:block;}

  /* Full-viewport fixed layer, split in two:
     .paywall-overlay mirrors .layout's own max-width + margin:auto
     centering exactly — on any viewport wider than 1680px, .layout
     centers itself with equal margins on both sides, and a naive
     hardcoded `left` value (relative to the raw viewport) completely
     ignores that offset, silently drifting into the sidebar on wide
     screens (the actual root cause here). Mirroring the same centering
     recipe keeps this box's left/right edges pixel-identical to
     .layout's at any width, so the inner .paywall-blur's offset (below)
     is always measured from the *correct* starting point.
     .paywall-blur is the actual visible/functional blur — offset from
     that already-correctly-centered box by the sidebar+divider width
     (adjusted per breakpoint below), so it can never land on the sidebar
     regardless of viewport width. z-index sits below the header (1000)
     and mobile-menu close button (1001) so those stay reachable; .sidebar
     and .footer also carry their own elevated z-index + opaque background
     (see above / below) as a second, independent safety net. */
  .paywall-overlay{
    display:none;
    position:fixed;
    top:0;bottom:0;left:0;right:0;
    max-width:1680px;
    margin:0 auto;
    z-index:700;
    pointer-events:none;
  }
  .paywall-overlay.open{display:block;}
  .paywall-blur{
    position:absolute;
    top:0;bottom:0;left:241px;right:0;
    display:flex;align-items:center;justify-content:center;
    pointer-events:auto;
    background-color:rgba(255,255,255,.2);
    backdrop-filter:blur(4px);
    -webkit-backdrop-filter:blur(4px);
  }
  .paywall-modal{
    position:relative;
    width:100%;max-width:400px;
    margin:0 24px;
    background:rgba(253,253,251,.85);
    backdrop-filter:blur(20px) saturate(160%);
    -webkit-backdrop-filter:blur(20px) saturate(160%);
    border:1px solid rgba(255,255,255,.6);
    border-radius:20px;
    padding:40px 34px;
    box-shadow:0 20px 40px rgba(0,0,0,.08), 0 1px 3px rgba(0,0,0,.05);
    text-align:center;
  }
  .paywall-modal h2{
    font-family:var(--serif);font-size:22px;font-weight:800;
    margin:0 0 10px;color:var(--ink);
  }
  .paywall-modal p{
    font-family:var(--sans);font-size:13.5px;line-height:1.6;
    color:var(--ink-soft);margin:0 0 24px;
  }
  .password-input{
    width:100%;padding:12px 14px;
    font-family:var(--sans);font-size:15px;color:var(--ink);
    background:rgba(255,255,255,.6);
    border:1px solid var(--line);border-radius:9px;
    margin-bottom:12px;
    transition:border-color .15s ease;
  }
  .password-input:focus{outline:none;border-color:var(--ink);}
  .password-submit{
    width:100%;padding:12px 14px;
    font-family:var(--sans);font-size:12.5px;font-weight:700;
    letter-spacing:.06em;text-transform:uppercase;
    background:var(--ink);color:#fff;
    border:none;border-radius:9px;cursor:pointer;
    transition:opacity .15s ease;
  }
  .password-submit:hover{opacity:.85;}
  .password-submit:disabled{opacity:.5;cursor:default;}
  .password-error{
    font-family:var(--sans);font-size:12.5px;color:#b3402f;
    margin-top:12px;min-height:16px;
  }

  /* Mode switcher (Stack / Vertical) pinned to the top of the sidebar,
     independent of which mode is active. */
  .fig-mode-switch{
    position:sticky;top:44px;z-index:5;
    display:flex;gap:6px;
    background:transparent;
    padding-bottom:14px;margin-bottom:8px;
  }
  .fig-mode-btn{
    display:flex;align-items:center;justify-content:center;
    width:30px;height:30px;padding:0;
    border:1px solid var(--line);background:var(--bg);color:var(--gray-light);
    cursor:pointer;transition:color .15s ease, border-color .15s ease, background .15s ease;
  }
  .fig-mode-btn svg{width:15px;height:15px;stroke:currentColor;}
  .fig-mode-btn:hover{color:var(--ink-soft);}
  .fig-mode-btn.active{color:var(--ink);border-color:var(--ink);background:var(--panel);}

  /* Vertical feed: each figure gets its own sticky slot so it pins while
     its matching section of narrative is being read, then hands off to
     the next figure as the reader scrolls past it. Offset sits below the
     mode-switch bar (~44px tall incl. padding) so images never tuck under it. */
  .fig-vertical-list{display:flex;flex-direction:column;}
  .fig-item-wrap{position:relative;}
  .fig-item{position:sticky;top:88px;padding-bottom:26px;}
  .fig-item--static{position:static;padding-bottom:26px;}

  /* ---------- Left sidebar ---------- */
  /* Category groups (Enterprise Case Studies / Independent & Labs) share
     identical styling via the same title/subtitle/list classes; only the
     spacing between groups differs, and only the currently-active
     category's title stays fully dark — the other dims out (but a shade
     darker than the subtitle below it, so title vs. subtitle stays legible
     even while de-emphasized). */
  .nav-category + .nav-category{margin-top:36px;}
  .sidebar-title{
    font-size:12px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;
    color:var(--ink);
    transition:color .15s ease;
  }
  .nav-category.is-inactive-category .sidebar-title{color:var(--gray);}
  .sidebar-sub{font-size:12px;color:var(--gray-light);margin-top:6px;margin-bottom:30px;}
  /* nav-list is pulled flush to the sidebar's outer (page) edge, then each
     item's text is padded back in to align with the sidebar title above it. */
  .nav-list{list-style:none;margin:0 0 0 calc(var(--side-pad) * -1);padding:0;}
  .nav-item{
    display:block;
    padding:14px 8px 14px var(--side-pad);
    cursor:pointer;
    color:var(--gray-light);
    transition:color .15s;
  }
  .nav-item .label-text{
    font-family:var(--sans);
    font-size:13.5px;
    line-height:1.35;
    font-weight:600;
  }
  .nav-item.active{color:var(--ink);}
  .nav-item:not(.active):hover{color:var(--ink-soft);}

  /* ---------- Main content ---------- */
  .eyebrow{font-size:11.5px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--gray);margin-bottom:18px;}
  .status-pill{
    display:inline-block;font-family:var(--sans);font-size:10.5px;font-weight:700;
    letter-spacing:.08em;text-transform:uppercase;color:var(--ink-soft);
    border:1px solid var(--line-strong);padding:4px 10px;border-radius:2px;margin-left:12px;
    vertical-align:middle;
  }
  h1.title{
    font-size:44px;line-height:1.12;font-weight:700;margin:0 0 26px 0;letter-spacing:-.01em;
  }
  p.subtitle{
    font-size:19px;line-height:1.55;color:var(--ink-soft);max-width:640px;margin:0 0 46px 0;
  }
  .section-head{
    font-size:13px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;
    font-family:var(--sans);
    border-bottom:1px solid var(--line);
    padding-bottom:12px;margin:52px 0 22px 0;
  }
  .section-head:first-of-type{margin-top:0;}
  p.body-text{font-size:16px;line-height:1.8;color:var(--ink);margin:0 0 18px 0;max-width:680px;}
  .kpi-grid{
    display:grid;grid-template-columns:1fr 1fr;border:1px solid var(--line);margin-bottom:6px;
  }
  .kpi-cell{
    padding:26px 30px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);
  }
  .kpi-cell:nth-child(2n){border-right:none;}
  .kpi-cell:nth-last-child(-n+2){border-bottom:none;}
  .kpi-label{font-family:var(--sans);font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--gray);margin-bottom:10px;}
  .kpi-value{font-size:30px;font-weight:700;margin-bottom:10px;}
  .kpi-desc{font-size:13.5px;line-height:1.5;color:var(--ink-soft);}
  blockquote.pull{
    border-left:2px solid var(--ink);
    margin:30px 0;padding:2px 0 2px 24px;
    font-style:italic;font-size:18px;line-height:1.6;color:var(--ink-soft);max-width:640px;
  }
  ul.bullets{margin:0 0 20px 0;padding-left:20px;max-width:680px;}
  ul.bullets li{font-size:16px;line-height:1.75;color:var(--ink);margin-bottom:10px;}
  ul.bullets li strong{color:var(--ink);}

  /* ---------- Right sidebar: dynamic tabbed figure card ---------- */
  .fig-card{margin-bottom:8px;}
  .fig-tabs{
    display:flex;flex-wrap:nowrap;align-items:center;gap:2px;
    font-family:var(--sans);font-size:10.5px;letter-spacing:.06em;
    margin-bottom:10px;
    overflow-x:auto;
    scroll-behavior:smooth;
    scrollbar-width:none;      /* Firefox */
    -ms-overflow-style:none;   /* old Edge/IE */
  }
  .fig-tabs::-webkit-scrollbar{display:none;} /* Chrome/Safari */
  .fig-tab{
    background:none;border:none;font-family:inherit;font-size:inherit;letter-spacing:inherit;
    color:var(--gray-light);cursor:pointer;padding:4px 2px;
    border-bottom:2px solid transparent;transition:color .15s ease, border-color .15s ease;
    white-space:nowrap;flex:none;
  }
  .fig-tab:hover{color:var(--ink-soft);}
  .fig-tab.active{color:var(--ink);font-weight:700;border-bottom-color:var(--ink);}
  .fig-tab-sep{color:var(--line);padding:0 6px;flex:none;}
  .fig-stage{
    position:relative;width:100%;aspect-ratio:16/10;
    border:0;border-radius:8px;overflow:hidden;cursor:zoom-in;
    transition:transform .6s cubic-bezier(.16,1,.3,1), box-shadow .6s ease;
  }
  .fig-card.is-highlighted .fig-stage,
  .fig-item.is-highlighted .fig-stage{
    transform:scale(1.02);
    box-shadow:0 0 0 3px rgba(24,24,26,.08);
  }
  .fig-img{
    position:absolute;inset:0;
    background:repeating-linear-gradient(135deg, #eceae4 0 2px, #f3f2ee 2px 14px);
    display:flex;align-items:center;justify-content:center;color:var(--gray-light);
    opacity:0;pointer-events:none;transition:opacity .3s ease;
  }
  .fig-img.active{opacity:1;pointer-events:auto;}
  .fig-img img{width:100%;height:100%;object-fit:cover;display:block;}

  /* Auto-fit variant (vertical mode only): height adapts to the image's own
     aspect ratio instead of being cropped into the fixed 16:10 box, so a
     tall screenshot displays in full at a fixed width. */
  .fig-stage--auto{aspect-ratio:auto;height:auto;}
  .fig-stage--auto .fig-img{
    position:relative;inset:auto;opacity:1;pointer-events:auto;
  }
  .fig-stage--auto .fig-img img{width:100%;height:auto;object-fit:contain;display:block;}
  .fig-cap{display:flex;justify-content:space-between;margin-top:10px;font-size:10.5px;}
  .fig-cap b{font-weight:700;letter-spacing:.05em;color:var(--ink);}
  .fig-cap span{color:var(--gray-light);}

  /* Inline text-to-image hotspot badge */
  /* Invisible marker used only to cap a preceding figure's sticky span so
     it can't bleed into the following section — not shown, not clickable. */
  .fig-boundary{display:block;height:0;}
  /* Invisible marker used to align a fig's sticky-pin start with a precise
     word or heading in the narrative, independent of paragraph/phase
     boundaries — not shown, not clickable. inline-block keeps it valid
     whether used mid-paragraph or standalone before a heading. */
  .fig-anchor{display:inline-block;width:0;height:0;overflow:hidden;vertical-align:top;}

  .fig-link{
    display:inline-block;
    font-family:var(--sans);font-size:11px;font-weight:700;letter-spacing:.05em;
    color:var(--ink-soft);background:var(--panel);
    border:1px solid var(--line);border-radius:3px;
    padding:1px 7px;margin:0 1px;cursor:pointer;
    transition:background .15s ease, border-color .15s ease, color .15s ease;
  }
  .fig-link:hover{background:var(--ink);color:#fff;border-color:var(--ink);}

  /* Small-screen waterfall images: plain, no tag/caption/interaction —
     hidden by default (desktop keeps using the right column as normal)
     and only shown once that column itself is hidden (see the
     max-width:1200px breakpoint below). */
  .mobile-fig{display:none;margin:24px 0;}
  .mobile-fig img{display:block;width:100%;height:auto;border-radius:8px;}

  /* ---------- Lightbox modal ---------- */
  .lightbox{
    position:fixed;inset:0;z-index:1000;
    background:rgba(12,12,11,.94);
    display:flex;align-items:center;justify-content:center;
    opacity:0;visibility:hidden;
    transition:opacity .25s ease, visibility 0s linear .25s;
  }
  .lightbox.open{opacity:1;visibility:visible;transition:opacity .25s ease;}
  .lightbox-inner{width:100%;max-width:min(90vw,960px);padding:0 24px;}
  .lightbox-stage{
    width:100%;aspect-ratio:16/10;
    background:transparent;
    border:none;color:#9b9a95;
    display:flex;align-items:center;justify-content:center;
    transform:scale(.96);transition:transform .5s cubic-bezier(.16,1,.3,1);
  }
  .lightbox.open .lightbox-stage{transform:scale(1);}
  .lightbox-stage img{width:100%;height:100%;object-fit:contain;display:block;}
  .lightbox-cap{
    margin-top:20px;text-align:center;font-family:var(--sans);
    font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:#d6d5d0;
  }
  .lightbox-close{
    position:absolute;top:28px;right:36px;
    background:none;border:1px solid #57564f;color:#d6d5d0;
    font-family:var(--sans);font-size:11px;letter-spacing:.08em;
    padding:8px 14px;cursor:pointer;
    transition:border-color .15s ease, color .15s ease;
  }
  .lightbox-close:hover{border-color:#d6d5d0;color:#fff;}

  /* ---------- Page-load entrance animation ---------- */
  .eyebrow, h1.title, p.subtitle, p.body-text, .about-title{
    opacity:0;
    transform:translateY(12px);
    transition:opacity .4s cubic-bezier(0.16,1,0.3,1), transform .4s cubic-bezier(0.16,1,0.3,1);
  }
  #main-content.is-visible .eyebrow{opacity:1;transform:translateY(0);transition-delay:.02s;}
  #main-content.is-visible h1.title,
  #main-content.is-visible .about-title{opacity:1;transform:translateY(0);transition-delay:.08s;}
  #main-content.is-visible p.subtitle{opacity:1;transform:translateY(0);transition-delay:.14s;}
  #main-content.is-visible p.body-text{opacity:1;transform:translateY(0);transition-delay:.2s;}
  #main-content.is-visible p.body-text:nth-of-type(2){transition-delay:.24s;}

// Applies (or clears) the blur/lock state for the page currently on screen.
// Only #main-content and #right-sidebar are ever touched — header and
// sidebar navigation stay fully interactive regardless of lock state. The
// visual blur is a separate curtain layer (backdrop-filter), so the real
// content's layout — including sticky figure positioning — is never
// altered by lock state; it stays accurate whether locked or not.
function updateProtectionUI(){
  const shouldLock = isCurrentPageLocked();

  document.getElementById("main-content").classList.toggle("is-locked", shouldLock);
  document.getElementById("right-sidebar").classList.toggle("is-locked", shouldLock);
  const mainCurtain = document.getElementById("main-blur-curtain");
  const rightCurtain = document.getElementById("right-blur-curtain");
  if (mainCurtain) mainCurtain.classList.toggle("active", shouldLock);
  if (rightCurtain) rightCurtain.classList.toggle("active", shouldLock);
  document.getElementById("password-overlay").classList.toggle("open", shouldLock);

  const errorEl = document.getElementById("password-error");
  const inputEl = document.getElementById("password-input");
  if (shouldLock) {
    if (errorEl) errorEl.textContent = "";
    if (inputEl) { inputEl.value = ""; setTimeout(() => inputEl.focus(), 50); }
  }
}

  const errorEl = document.getElementById("password-error");
  const submitBtn = document.getElementById("password-submit");
  const value = inputEl.value;
  if (!value) {
    errorEl.textContent = "Please enter a password.";
    return;
  }
  if (!window.crypto || !window.crypto.subtle) {
    // Web Crypto's subtle.digest requires a secure context (https:// or
    // localhost) — it's unavailable if this file is opened directly via
    // file://. Host it (even a simple static host) to enable this.
    errorEl.textContent = "Password check unavailable in this environment (requires https:// hosting).";
    return;
  }
  submitBtn.disabled = true;
  try {
    const hash = await sha256Hex(value);
    if (hash === PASSWORD_HASH) {
      markUnlocked();
      updateProtectionUI(); // re-checks isUnlocked() → unlocks immediately
    } else {
      errorEl.textContent = "Incorrect password. Please try again.";
      inputEl.value = "";
      inputEl.focus();
    }
  } finally {
    submitBtn.disabled = false;
  }
}

function renderNav(){
  const container = document.getElementById("nav-groups");
  const activeProject = PROJECTS.find(p => p.id === currentProject);
  const activeCategoryId = (currentView === "case" && activeProject) ? activeProject.category : null;
  container.innerHTML = CATEGORIES.map(cat => {
    const items = PROJECTS.filter(p => p.category === cat.id);
    if (!items.length) return "";
    const isActiveCat = cat.id === activeCategoryId;
    return `
      <div class="nav-category ${isActiveCat ? 'is-active-category' : 'is-inactive-category'}">
        <div class="sidebar-title">${cat.title}</div>
        <div class="sidebar-sub">${cat.subtitle}</div>
        <ul class="nav-list">
          ${items.map(p => `
            <li class="nav-item ${currentView==='case' && currentProject===p.id ? 'active':''}" onclick="selectProject('${p.id}')">
              <span class="label-text">${p.num}. ${p.navLabel}</span>
            </li>
          `).join("")}
        </ul>
      </div>
    `;
  }).join("");
}

// Full-screen mobile nav overlay: "Case Studies" as a top-level link,
// followed by the same category groupings as the desktop sidebar, then
// "My Story". Rendered once — item content doesn't depend on which
// project is currently open, so no need to re-render on every navigation.
function renderMobileMenu(){
  const container = document.getElementById("mobile-menu-content");
  if (!container) return;
  const activeProject = PROJECTS.find(p => p.id === currentProject);
  const activeCategoryId = (currentView === "case" && activeProject) ? activeProject.category : null;
  const categoriesHtml = CATEGORIES.map(cat => {
    const items = PROJECTS.filter(p => p.category === cat.id);
    if (!items.length) return "";
    const isActiveCat = cat.id === activeCategoryId;
    return `

        <div class="mobile-menu-cat-title">${cat.title}</div>

          ${items.map(p => `<a class="mobile-menu-link ${currentView==='case' && currentProject===p.id ? 'active':''}" onclick="selectProjectFromMenu('${p.id}')">${p.num}. ${p.navLabel}</a>`).join("")}
        </div>

    ${categoriesHtml}

function toggleMobileMenu(){
  const menu = document.getElementById("mobile-menu");
  const btn = document.getElementById("hamburger-btn");
  const willOpen = !menu.classList.contains("open");
  menu.classList.toggle("open", willOpen);
  btn.classList.toggle("open", willOpen);
  btn.setAttribute("aria-expanded", String(willOpen));
  document.body.style.overflow = willOpen ? "hidden" : "";
}

function closeMobileMenu(){
  document.getElementById("mobile-menu").classList.remove("open");
  document.getElementById("hamburger-btn").classList.remove("open");
  document.getElementById("hamburger-btn").setAttribute("aria-expanded", "false");
  document.body.style.overflow = "";

function selectProjectFromMenu(id){ closeMobileMenu(); selectProject(id); }
function showCaseStudiesFromMenu(){ closeMobileMenu(); showCaseStudies(); }
function showAboutFromMenu(){ closeMobileMenu(); showAbout(); }


function renderMeta(meta){
  return `<p class="body-text"><em>${meta.map(m=>`<strong>${m[0]}:</strong> ${m[1]}`).join(' &nbsp;·&nbsp; ')}</em></p>`;
}

function renderKpis(kpis){
  return `<div class="kpi-grid">${kpis.map(k=>`
    <div class="kpi-cell">
      <div class="kpi-label">${k[0]}</div>
      <div class="kpi-value">${k[1]}</div>
      <div class="kpi-desc">${k[2]}</div>
    </div>`).join("")}</div>`;
}

function renderSection(s){
  const headText = s.headingRaw ? s.headingRaw.toUpperCase() : `${s.num} / ${s.heading.toUpperCase()}`;
  let html = "";
  if (s.boundaryFor) html += `<span class="fig-boundary" data-fig-boundary="${s.boundaryFor}"></span>`;
  html += `<div class="section-head"${s.anchorFor ? ` data-fig-anchor="${s.anchorFor}"` : ""}>${headText}</div>`;
  if (s.blocks){
    html += s.blocks.map(b => {
      if (b.type === "p") return `<p class="body-text">${b.text}</p>`;
      if (b.type === "ul") return `<ul class="bullets">${b.items.map(i=>`<li>${i}</li>`).join("")}</ul>`;
      return "";
    }).join("");
  }
  if (s.paras) html += s.paras.map(p=>`<p class="body-text">${p}</p>`).join("");
  if (s.quote) html += `<blockquote class="pull">"${s.quote}"</blockquote>`;
  if (s.bullets) html += `<ul class="bullets">${s.bullets.map(b=>`<li>${b}</li>`).join("")}</ul>`;
  if (s.phases){
    html += s.phases.map(ph => `
      ${ph.boundaryFor ? `<span class="fig-boundary" data-fig-boundary="${ph.boundaryFor}"></span>` : ""}
      <div class="phase-head"${ph.anchorFor ? ` data-fig-anchor="${ph.anchorFor}"` : ""}>${ph.title}</div>
      ${(ph.paras||[]).map(p=>`<p class="body-text">${p}</p>`).join("")}
      ${ph.bullets ? `<ul class="bullets">${ph.bullets.map(b=>`<li>${b}</li>`).join("")}</ul>` : ""}
      ${(ph.after||[]).map(p=>`<p class="body-text">${p}</p>`).join("")}
    `).join("");
  }
  if (s.closing) html += `<p class="body-text">${s.closing}</p>`;
  return html;
}

/* ---------- Right column: mode switcher + stack card / vertical feed ---------- */

// "FIG_01: 3-TIER_IA_MAP" -> "FIG_01"
function figCode(label){
  return label.split(":")[0].trim();
}

function renderModeSwitch(){
  return `
    <div class="fig-mode-switch">
      <button type="button" class="fig-mode-btn ${figMode==='stack'?'active':''}" title="Stack view" aria-label="Stack view" onclick="setFigMode('stack')">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
          <rect x="2" y="4" width="5.5" height="16" rx="1"/>
          <rect x="9.25" y="4" width="5.5" height="16" rx="1"/>
          <rect x="16.5" y="4" width="5.5" height="16" rx="1"/>
        </svg>
      </button>
      <button type="button" class="fig-mode-btn ${figMode==='vertical'?'active':''}" title="Vertical view" aria-label="Vertical view" onclick="setFigMode('vertical')">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
          <rect x="4" y="3" width="16" height="4.5" rx="1"/>
          <rect x="4" y="9.75" width="16" height="4.5" rx="1"/>
          <rect x="4" y="16.5" width="16" height="4.5" rx="1"/>
        </svg>
      </button>
    </div>
  `;
}

function figPlaceholderSvg(size){
  return `
    <svg width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.3">
      <rect x="3" y="4" width="18" height="16" rx="1.5"/>
      <circle cx="9" cy="10" r="1.6"/>
      <path d="M4 17l5-5 4 4 3-3 4 4"/>
    </svg>
  `;
}

// f = [label, size, imgSrc?]. If an image path is present, render a real
// <img> (object-fit handled in CSS); otherwise fall back to the placeholder
// icon so figs without an image path yet still render normally.
function figMediaHtml(f, placeholderSize){
  const src = f[2];
  if (src) return `<img src="${src}" alt="${f[0]}" loading="lazy">`;
  return figPlaceholderSvg(placeholderSize);
}

// Mode A — all figures live inside one sticky card with a tab switcher.
function renderFigCard(figs){
  return `
    <div class="fig-card" id="fig-card">
      <div class="fig-tabs">
        ${figs.map((f,i)=>`<button type="button" class="fig-tab ${i===0?'active':''}" data-idx="${i}" onclick="setActiveFig(${i})">${figCode(f[0])}</button>${i<figs.length-1?'<span class="fig-tab-sep">|</span>':''}`).join("")}
      </div>
      <div class="fig-stage" id="fig-stage" onclick="openLightbox()">
        ${figs.map((f,i)=>`
          <div class="fig-img ${i===0?'active':''}" data-idx="${i}">
            ${figMediaHtml(f, 34)}
          </div>
        `).join("")}
      </div>
      <div class="fig-cap"><b id="fig-cap-label">${figs[0][0]}</b></div>
    </div>
  `;
}

// Mode B — figures unstack into a vertical feed. By default each item is
// independently sticky so it pins while its matching section of text is
// being read (see .fig-item). Projects can opt into a "static" layout
// instead (via p.figVerticalLayout === "static") where items don't pin —
// useful when a figure is too tall for sticky-tracking to feel good; each
// item is simply positioned (via margin-top) to line up with its anchor
// and then scrolls normally with the page.
function renderFigListVertical(figs, layoutMode){
  const isStatic = layoutMode === "static";
  return `
    <div class="fig-vertical-list">
      ${figs.map((f,i)=>`
        <div class="fig-item-wrap" data-idx="${i}" data-fig-code="${figCode(f[0])}">
          <div class="fig-item ${isStatic ? 'fig-item--static' : ''}" id="fig-item-${i}">
            <div class="fig-stage ${f[3]==='auto' ? 'fig-stage--auto' : ''}" onclick="openLightboxAt(${i})">
              <div class="fig-img active">${figMediaHtml(f, 34)}</div>
            </div>
            <div class="fig-cap"><b>${f[0]}</b></div>
          </div>
        </div>
      `).join("")}
    </div>
  `;
}

function renderRightSidebar(p){
  currentFigs = p.figs;
  activeFigIndex = 0;
  const right = document.getElementById("right-sidebar");
  right.classList.toggle("mode-vertical", figMode === "vertical");
  right.innerHTML = `<div class="blur-curtain" id="right-blur-curtain"></div>` +
    renderModeSwitch() + (figMode === "vertical" ? renderFigListVertical(p.figs, p.figVerticalLayout) : renderFigCard(p.figs));
  document.getElementById("right-divider").style.display = "";
  right.style.display = "";
  if (figMode === "vertical") {
    syncCurrentFigLayout();
    // Late text reflow (e.g. the web font finishing its swap-in after the
    // first paint) can shift anchor positions after this initial pass —
    // re-measure shortly after to correct for it.
    setTimeout(() => { if (figMode === "vertical") syncCurrentFigLayout(); }, 350);
  }
}

// User's chosen display mode persists across project switches (and reloads).
function setFigMode(mode){
  if (mode !== "stack" && mode !== "vertical") return;
  if (mode === figMode) return;
  figMode = mode;
  saveFigMode(mode);
  const project = PROJECTS.find(pr=>pr.id===currentProject);
  if (project) renderRightSidebar(project);
}

// Anchor point (document Y) for a given fig code. Priority:
//   1. An explicit element carrying [data-fig-anchor="CODE"] — either a real
//      heading (e.g. a .phase-head) or a zero-size inline marker placed at
//      a precise word — whichever a fig should align with (most precise).
//   2. Otherwise, the top of the paragraph containing its [FIG_0X] badge —
//      so an image still starts pinning as its section *begins*, even
//      though the clickable badge itself sits at the end of that text.
// Returns null if the project has no anchor or hotspot for this fig at all
// (e.g. a lead/cover image with nothing to bind to).
function figAnchorTop(code){
  const explicit = document.querySelector(`#main-content [data-fig-anchor="${code}"]`);
  if (explicit) return explicit.getBoundingClientRect().top + window.scrollY;
  const link = document.querySelector(`#main-content .fig-link[data-fig="${code}"]`);
  if (!link) return null;
  const anchorEl = link.closest("p") || link;
  return anchorEl.getBoundingClientRect().top + window.scrollY;
}

// Position (document Y) of an explicit "stop here" boundary for a fig code,
// if the project defines one via a section's `boundaryFor` field. Used to
// cap the last figure's span so it can't bleed into a following section
// that has no figure of its own.
function figBoundaryTop(code){
  const marker = document.querySelector(`#main-content .fig-boundary[data-fig-boundary="${code}"]`);
  if (!marker) return null;
  return marker.getBoundingClientRect().top + window.scrollY;
}

// Stack-mode scroll-driven tab switching, with an intentionally asymmetric
// trigger point: scrolling further DOWN the page only switches to a figure
// once its anchor has actually travelled well up into the viewport (~60%
// of the way down from the top) — so the reader has to have genuinely
// reached that section, not just glimpsed its first line at the bottom
// edge. Scrolling back UP keeps the looser, already-comfortable trigger
// used before (~20% down), since that direction wasn't reported as an
// issue. Runs on scroll, throttled to one check per animation frame.
let figLastScrollY = window.scrollY;
let figScrollRAF = null;

function updateActiveFigFromScroll(){
  if (figMode !== "stack" || !currentFigs.length) return;

  const currentY = window.scrollY;
  const direction = currentY >= figLastScrollY ? "down" : "up";
  figLastScrollY = currentY;

  const vh = window.innerHeight;
  const threshold = direction === "down" ? vh * 0.60 : vh * 0.20;

  let candidateIdx = null;
  currentFigs.forEach((f, i) => {
    const top = figAnchorTop(figCode(f[0]));
    if (top === null) return;
    const viewportTop = top - currentY;
    if (viewportTop <= threshold) candidateIdx = i; // last (furthest) match wins
  });

  if (candidateIdx !== null && candidateIdx !== activeFigIndex) {
    setActiveFig(candidateIdx, false);
  }
}

function onFigScroll(){
  if (figScrollRAF) return;
  figScrollRAF = requestAnimationFrame(() => {
    figScrollRAF = null;
    updateActiveFigFromScroll();
  });
}

// In vertical mode, size each figure's wrapper to roughly match the length
// of its corresponding text passage, so each image's *top edge* lines up
// with its matching sentence/heading on the left as that section begins,
// and hands off to the next figure once the next section starts.
//
// Important: the right column's figure stack and the left column's text
// don't start at the same Y position (the left column has an eyebrow/title
// above its first paragraph that the right column doesn't have an
// equivalent of), so wrap[0]'s span can't be measured anchor-to-anchor
// like the rest — it has to be measured from the right column's own true
// starting position down to fig[1]'s text anchor. Every wrap after that
// chains correctly because, once wrap[0] is sized right, wrap[1] lands
// exactly on its own text anchor, and so on down the stack.
function syncVerticalFigHeights(){
  const wraps = Array.from(document.querySelectorAll("#right-sidebar .fig-item-wrap"));
  if (!wraps.length) return;

  // Reset first so measurements reflect natural (un-stretched) layout.
  wraps.forEach(w => { w.style.minHeight = ""; });
  void document.body.offsetHeight; // force reflow

  // Real text-side anchor for each fig (null if this fig has none at all).
  const textAnchors = wraps.map((wrap, i) => {
    const code = currentFigs[i] ? figCode(currentFigs[i][0]) : null;
    return code ? figAnchorTop(code) : null;
  });

  // Where the figure stack itself actually begins on screen — fixed, and
  // deliberately NOT the same as fig[0]'s own text anchor (see note above).
  const columnStart = wraps[0].getBoundingClientRect().top + window.scrollY;

  wraps.forEach((wrap, i) => {
    const item = wrap.querySelector(".fig-item");
    const itemHeight = item ? item.offsetHeight : 300;
    const code = currentFigs[i] ? figCode(currentFigs[i][0]) : null;
    const startPos = i === 0 ? columnStart : textAnchors[i];
    const nextPos = textAnchors[i+1];
    const base = startPos != null ? startPos : (wrap.getBoundingClientRect().top + window.scrollY);
    const boundary = code ? figBoundaryTop(code) : null;

    const candidates = [];
    if (startPos != null && nextPos != null && nextPos > startPos) {
      candidates.push(nextPos - startPos);
    }
    if (boundary !== null && boundary > base) {
      candidates.push(boundary - base);
    }

    let span;
    if (candidates.length) {
      span = Math.min(...candidates);
    } else {
      span = Math.max(window.innerHeight, itemHeight + 200);
    }
    wrap.style.minHeight = Math.max(span, itemHeight + 40) + "px";
  });
}

// Non-sticky counterpart to syncVerticalFigHeights(), used when a project's
// figVerticalLayout is "static" (e.g. an image too tall for the pin/release
// effect to feel good). Instead of computing a wrap height to hold a
// sticky item in place, this pushes each item down (via margin-top) until
// its top lines up with its own anchor, then leaves it in normal flow —
// it scrolls away with the page like any other content, no pinning.
// Items with no anchor at all (e.g. a figure meant to just stack directly
// under the previous one) get a small fixed gap instead.
function syncStaticFigPositions(){
  const wraps = Array.from(document.querySelectorAll("#right-sidebar .fig-item-wrap"));
  if (!wraps.length) return;

  wraps.forEach(w => { w.style.marginTop = "0px"; });
  void document.body.offsetHeight; // force reflow

  const DEFAULT_GAP = 28; // px gap used when a fig has no anchor to align to

  wraps.forEach((wrap, i) => {
    const code = currentFigs[i] ? figCode(currentFigs[i][0]) : null;
    const anchor = code ? figAnchorTop(code) : null;
    const rect = wrap.getBoundingClientRect();
    const naturalTop = rect.top + window.scrollY;
    let marginTop;
    if (i === 0) {
      // Lead/hero figure: always sits at the top of the column, same as
      // every other project's FIG_01 — never pushed down to align with
      // its own anchor (that would put it much further down the page).
      marginTop = 0;
    } else if (anchor !== null && anchor > naturalTop) {
      marginTop = anchor - naturalTop;
    } else {
      marginTop = DEFAULT_GAP;
    }
    wrap.style.marginTop = marginTop + "px";
    void document.body.offsetHeight; // reflow so the next item measures correctly
  });
}

// Runs whichever vertical-layout sync applies to the currently-rendered
// project (sticky span-chaining by default, or static margin positioning
// for projects that opt into figVerticalLayout: "static").
function syncCurrentFigLayout(){
  const project = PROJECTS.find(p => p.id === currentProject);
  if (project && project.figVerticalLayout === "static") {
    syncStaticFigPositions();
  } else {
    syncVerticalFigHeights();
  }
}

// Highlight (and, in stack mode, switch to) figure index `idx`.
// Keeps the active tab visible in the horizontally-scrolling tab strip, and
// also peeks the *next* tab into view when it would otherwise overflow the
// right edge (e.g. activating FIG_06 reveals FIG_07), or the *previous*
// tab when it would overflow the left edge (e.g. activating FIG_02 reveals
// FIG_01) — same code path whether triggered by a click or by scrolling.
function scrollTabIntoView(idx){
  const container = document.querySelector("#fig-card .fig-tabs");
  if (!container) return;
  const tabs = container.querySelectorAll(".fig-tab");
  const activeTab = tabs[idx];
  if (!activeTab) return;
  const prevTab = tabs[idx-1] || activeTab;
  const nextTab = tabs[idx+1] || activeTab;
  const cRect = container.getBoundingClientRect();
  const pRect = prevTab.getBoundingClientRect();
  const nRect = nextTab.getBoundingClientRect();
  const PEEK = 12; // small breathing-room margin, px

  if (nRect.right > cRect.right){
    container.scrollBy({ left: nRect.right - cRect.right + PEEK, behavior: "smooth" });
  } else if (pRect.left < cRect.left){
    container.scrollBy({ left: pRect.left - cRect.left - PEEK, behavior: "smooth" });
  }
}

function setActiveFig(idx, highlight){
  if (!currentFigs[idx]) return;
  activeFigIndex = idx;

  if (figMode === "vertical"){
    document.querySelectorAll("#right-sidebar .fig-item").forEach((el,i)=>{
      el.classList.toggle("is-highlighted", !!highlight && i===idx);
    });
    return;
  }

  document.querySelectorAll("#fig-card .fig-tab").forEach((t,i)=>t.classList.toggle("active", i===idx));
  document.querySelectorAll("#fig-card .fig-img").forEach((el,i)=>el.classList.toggle("active", i===idx));
  const labelEl = document.getElementById("fig-cap-label");
  if (labelEl) labelEl.textContent = currentFigs[idx][0];
  const card = document.getElementById("fig-card");
  if (card) card.classList.toggle("is-highlighted", !!highlight);
  scrollTabIntoView(idx);
}

function clearFigHighlight(){
  if (figMode === "vertical"){
    document.querySelectorAll("#right-sidebar .fig-item.is-highlighted").forEach(el=>el.classList.remove("is-highlighted"));
  } else {
    const card = document.getElementById("fig-card");
    if (card) card.classList.remove("is-highlighted");
  }
}

// Hovering an inline [FIG_0X] badge in the narrative highlights (and, in
// stack mode, switches to) the matching figure. Scroll-driven switching is
// handled separately by updateActiveFigFromScroll() (direction-aware).
// Bound once per main-content render (not per mode switch).
function bindFigHotspots(){
  document.querySelectorAll("#main-content .fig-link").forEach(el=>{
    const idx = currentFigs.findIndex(f=>figCode(f[0])===el.dataset.fig);
    if (idx<0) return;
    el.addEventListener("mouseenter", ()=>setActiveFig(idx, true));
    el.addEventListener("mouseleave", clearFigHighlight);
  });
}

function openLightboxAt(idx){
  activeFigIndex = idx;
  openLightbox();
}

function openLightbox(){
  if (!currentFigs[activeFigIndex]) return;
  const f = currentFigs[activeFigIndex];
  document.getElementById("lightbox-cap").textContent = f[0];
  document.getElementById("lightbox-stage").innerHTML = figMediaHtml(f, 72);
  document.getElementById("lightbox").classList.add("open");
  document.body.style.overflow = "hidden";
}

function closeLightbox(){
  document.getElementById("lightbox").classList.remove("open");
  document.body.style.overflow = "";
}

// Subtle page-load / project-switch entrance animation for the narrative text.
function playEntrance(){
  const el = document.getElementById("main-content");
  el.classList.remove("is-visible");
  void el.offsetWidth; // force reflow so the removal takes effect first
  requestAnimationFrame(()=>{
    requestAnimationFrame(()=>{
      el.classList.add("is-visible");
    });
  });
}

// Small-screen fallback: once the right image column is hidden (see the
// max-width:1200px breakpoint), each figure that has a real image is
// inserted as a plain <img> directly after its corresponding anchor point
// in the main text — heading first if the fig has an explicit anchor
// (anchorFor / data-fig-anchor), else the paragraph/bullet-list containing
// its [FIG_0X] badge. No tabs, no captions, no click-to-zoom, no sticky —
// just a simple waterfall of images between paragraphs. Purely additive:
// these elements stay display:none until the small-screen media query
// turns them on, so none of the desktop right-column behavior changes.
// Because they live inside #main-content, they're automatically covered
// by the exact same .blur-curtain / lock system already applied there.
function insertMobileFigures(p){
  document.querySelectorAll("#main-content .mobile-fig").forEach(el => el.remove());
  if (!p.figs || !p.figs.length) return;

  p.figs.forEach(f => {
    const src = f[2];
    if (!src) return; // skip placeholder-only figs — nothing real to show inline

    const code = figCode(f[0]);
    let anchorTarget = document.querySelector(`#main-content [data-fig-anchor="${code}"]`);

    if (!anchorTarget) {
      const link = document.querySelector(`#main-content .fig-link[data-fig="${code}"]`);
      if (link) {
        const li = link.closest("li");
        anchorTarget = link.closest("p") || (li ? li.closest("ul") : null) || link;
      }
    }
    if (!anchorTarget) return; // no clear place to attach this fig on mobile — skip it

    const wrap = document.createElement("div");
    wrap.className = "mobile-fig";
    wrap.innerHTML = `<img src="${src}" alt="${f[0]}" loading="lazy">`;
    anchorTarget.insertAdjacentElement("afterend", wrap);
  });
}

function renderProject(p){
  const execHeading = p.execHeading || "Executive Summary";
  document.getElementById("main-content").innerHTML = `
    <div class="blur-curtain" id="main-blur-curtain"></div>
    <div class="eyebrow">${p.eyebrow}</div>
    <h1 class="title">${p.title}${p.status ? `<span class="status-pill">${p.status}</span>`:''}</h1>
    <p class="subtitle">${p.subtitle}</p>
    ${renderMeta(p.meta)}
    <div class="section-head" style="margin-top:46px;">${execHeading.toUpperCase()}</div>
    ${p.execSummary.map(t=>`<p class="body-text">${t}</p>`).join("")}
    ${p.kpis ? `<div class="section-head">Key Performance Indicators</div>${renderKpis(p.kpis)}` : ""}
    ${p.sections.map(renderSection).join("")}
  `;
  renderRightSidebar(p);
  bindFigHotspots();
  insertMobileFigures(p);
  playEntrance();
}

function renderAbout(){
  document.getElementById("main-content").innerHTML = `
    <div class="about-grid">
      <div class="about-left">
        <h1 class="about-title">Hello</h1>
      </div>
      <div class="about-right">
        <p class="body-text">I grew up in Nanjing, a beautiful city in southern China where urban life met nature. As a child, I spent countless hours with my parents wandering the mountains, catching beetles, and marveling at the patterns on their backs — each one slightly different, but never random. I used to sit down and sketch everything I saw in my notebook, tracing every line until I understood why it repeated the way it did...</p>
        <p class="body-text">Years passed, I crossed the ocean to the U.S. Life has taken me from the east coast to the west coast, and now to Central Texas, where I've built a home of my own. I like to take my daughter to feed birds, and one day, when a parakeet gently landed on her hand, she burst into a bright, unguarded laugh. It lasted only a second — but in that second, I saw my own childhood in hers, completely still, completely amazed.</p>
        <p class="body-text">That second didn't come out of nowhere, though. It took years of watching her before I could even recognize it when it happened. And that's what beauty has always meant to me — not the first shiny impression, but the quiet, slow-building kind that only shows itself if you stay long enough to notice it. It's the same patience I had watching beetles as a kid, and the same one I feel now, watching my daughter watch the world for the first time all over again.</p>
      </div>
    </div>
  `;
  document.getElementById("right-divider").style.display = "none";
  document.getElementById("right-sidebar").style.display = "none";
  currentFigs = [];
  playEntrance();
}

function selectProject(id){
  currentView = "case";
  currentProject = id;
  document.body.classList.remove("view-about");
  document.body.classList.add("view-case");
  document.getElementById("nav-cases").classList.add("active");
  document.getElementById("nav-about").classList.remove("active");
  renderNav();
  renderMobileMenu();
  renderProject(PROJECTS.find(p=>p.id===id));
  updateProtectionUI();
  window.scrollTo({top:0, behavior:"smooth"});
}

function showCaseStudies(){ selectProject(currentProject); }

function showAbout(){
  currentView = "about";
  document.body.classList.remove("view-case");
  document.body.classList.add("view-about");
  document.getElementById("nav-cases").classList.remove("active");
  document.getElementById("nav-about").classList.add("active");
  renderMobileMenu();
  renderAbout();
  updateProtectionUI();
  window.scrollTo({top:0, behavior:"smooth"});
}

// init
document.body.classList.add("view-case");
renderNav();
renderMobileMenu();
renderProject(PROJECTS[0]);
updateProtectionUI();

document.getElementById("lightbox-close").addEventListener("click", closeLightbox);
document.getElementById("lightbox").addEventListener("click", (e)=>{
  if (e.target.id === "lightbox") closeLightbox();
});
document.addEventListener("keydown", (e)=>{
  if (e.key === "Escape") {
    closeLightbox();
    closeMobileMenu();
  }
});

document.getElementById("password-submit").addEventListener("click", submitPassword);
document.getElementById("password-input").addEventListener("keydown", (e)=>{
  if (e.key === "Enter") submitPassword();
});

window.addEventListener("resize", ()=>{
  clearTimeout(figResizeTimer);
  figResizeTimer = setTimeout(()=>{
    if (figMode === "vertical") syncCurrentFigLayout();
  }, 150);
});

if (document.fonts && document.fonts.ready) {
  document.fonts.ready.then(() => {
    if (figMode === "vertical") syncCurrentFigLayout();
  });
}

window.addEventListener("scroll", onFigScroll, { passive: true });
</script>
</body>
</html>
